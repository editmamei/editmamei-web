name: Leak Guard

# Fails the build if any 'dev' or 'none'-tier tool name from Editmamei's
# src/core/tool-tiers.ts leaks into this marketing-site source. The
# blocklist is maintained in scripts/check-leak-guard.mjs alongside a
# sync note pointing at the source-of-truth in Editmamei.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  leak-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Run leak guard
        run: node scripts/check-leak-guard.mjs
