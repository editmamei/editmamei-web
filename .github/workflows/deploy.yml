name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  # web-release.yml dispatches this on main after fast-forwarding it (its
  # GITHUB_TOKEN push can't fire the push trigger above; the release
  # fan-out pushes with a PAT and still can).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The production environment allows the main branch only and holds the
    # Cloudflare secrets, so no other ref can reach them.
    environment:
      name: production
      url: https://editmamei.com
    steps:
      - name: Refuse to deploy any ref but main
        if: github.ref != 'refs/heads/main'
        env:
          REF: ${{ github.ref }}
        run: |
          echo "production deploys main only (got: $REF)"
          exit 1

      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 22+: `node --test` glob args (the test script) need Node >= 21,
          # and Node 20 is past EOL on the runners.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (svelte-check)
        run: npm run check

      - name: Lint
        run: npm run lint

      # Build before test so tests/blog-build-artifacts.test.mjs inspects the
      # artifact that gets deployed.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Leak guard
        run: node scripts/check-leak-guard.mjs

      - name: Deploy the editmamei-web Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SHA: ${{ github.sha }}
        run: |
          SHORT="${SHA:0:12}"
          npx wrangler deploy --tag "$SHORT" --message "main $SHORT"

      # The route hands editmamei.com to the Worker. GitHub Pages answers with
      # `Via: 1.1 varnish` and no HSTS header; the Worker sends HSTS from
      # static/_headers. Fail the run if the live home page is missing or still
      # coming from Pages, so a deploy that didn't take is visible.
      - name: Check the live site is served by the Worker
        run: |
          for i in 1 2 3 4 5 6; do
            HEADERS=$(curl -s -o /dev/null -D - --max-time 15 https://editmamei.com/ | tr -d '\r')
            CODE=$(printf '%s\n' "$HEADERS" | awk 'NR == 1 { print $2 }')
            if [ "$CODE" = 200 ] && ! printf '%s\n' "$HEADERS" | grep -iq '^via: .*varnish' \
              && printf '%s\n' "$HEADERS" | grep -iq '^strict-transport-security:'; then
              echo "editmamei.com is served by the Worker"
              exit 0
            fi
            echo "not yet (attempt $i: $CODE), retrying in 10s..."; sleep 10
          done
          echo "::error::editmamei.com is not served by the Worker after deploy"
          exit 1

  ping-indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Notify IndexNow (URL list derived from the live sitemap)
        run: |
          set -euo pipefail
          KEY="a4f8aefcc57e44b2992e9ff9694f520f"
          SITEMAP="https://editmamei.com/sitemap.xml"
          # Single source of truth: pull the just-deployed sitemap and extract its
          # <loc> URLs. A new indexable route is pinged automatically once it's in
          # the sitemap ROUTES array — no hand-maintained URL list here to drift.
          # Retry a few times in case the edge hasn't picked up the new version yet.
          URLS=""
          for i in 1 2 3 4 5; do
            URLS=$(curl -sf "$SITEMAP" | sed -n 's:.*<loc>\(.*\)</loc>.*:\1:p' || true)
            [ -n "$URLS" ] && break
            echo "sitemap not ready (attempt $i), retrying in 10s..."; sleep 10
          done
          if [ -z "$URLS" ]; then echo "Could not read sitemap URLs"; exit 1; fi
          PAYLOAD=$(printf '%s\n' "$URLS" | jq -R . | jq -s \
            --arg host "editmamei.com" --arg key "$KEY" \
            --arg keyLoc "https://editmamei.com/$KEY.txt" \
            '{host: $host, key: $key, keyLocation: $keyLoc, urlList: .}')
          echo "Submitting these URLs to IndexNow:"; printf '%s\n' "$URLS"
          curl -sf -o /dev/null -w "IndexNow status: %{http_code}\n" \
            -X POST "https://api.indexnow.org/IndexNow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$PAYLOAD"
