name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read # actions/configure-pages reads the Pages config
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 22+: `node --test` glob args (the test script) need Node >= 21,
          # and Node 20 is past EOL on the runners.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (svelte-check)
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  ping-indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Notify IndexNow
        run: |
          curl -sf -o /dev/null -w "IndexNow status: %{http_code}\n" \
            -X POST "https://api.indexnow.org/IndexNow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{
              "host": "editmamei.com",
              "key": "a4f8aefcc57e44b2992e9ff9694f520f",
              "keyLocation": "https://editmamei.com/a4f8aefcc57e44b2992e9ff9694f520f.txt",
              "urlList": [
                "https://editmamei.com/",
                "https://editmamei.com/product",
                "https://editmamei.com/pricing"
              ]
            }'
