name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  # web-release.yml dispatches this on main after fast-forwarding it (its
  # GITHUB_TOKEN push can't fire the push trigger above; the release
  # fan-out pushes with a PAT and still can).
  workflow_dispatch:
  # Daily rebuild to refresh the sitemap with newly approved gallery entries.
  # The gallery pages themselves render on request from Connect's feed.
  # Scheduled runs use the default branch (main); the ref guard below still
  # refuses anything else.
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  # Build, typecheck, lint and test run with NO secrets and no environment:
  # `npm ci` executes dependency install scripts, which must not share a job with
  # the Cloudflare token or the Resend key (V1). GALLERY_FEED_REQUIRED is read
  # from repository-level variables here, not from the production environment.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to deploy any ref but main
        if: github.ref != 'refs/heads/main'
        env:
          REF: ${{ github.ref }}
        run: |
          echo "production deploys main only (got: $REF)"
          exit 1

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # 22+: `node --test` glob args (the test script) need Node >= 21,
          # and Node 20 is past EOL on the runners.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (svelte-check)
        run: npm run check

      - name: Lint
        run: npm run lint

      # Build before test so tests/blog-build-artifacts.test.mjs inspects the
      # artifact that gets deployed.
      - name: Build
        env:
          GALLERY_FEED_REQUIRED: ${{ vars.GALLERY_FEED_REQUIRED }}
        run: npm run build

      - name: Test
        run: npm test

      - name: Leak guard
        run: node scripts/check-leak-guard.mjs

      # Hand the build to the secret-bearing job below. Nothing here is secret.
      # cloudflare-tmp holds the route manifest _worker.js imports.
      - name: Upload the build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site-build
          path: |
            wrangler.jsonc
            .svelte-kit/cloudflare
            .svelte-kit/cloudflare-tmp
            .svelte-kit/output
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # Holds the production secrets. Dependencies install with --ignore-scripts, so
  # no package's install script runs beside the Cloudflare token; wrangler then
  # bundles the artifact built above against the locked packages.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    # The production environment allows the main branch only and holds the
    # Cloudflare and Resend secrets, so no other ref can reach them.
    environment:
      name: production
      url: https://editmamei.com
    steps:
      - name: Refuse to deploy any ref but main
        if: github.ref != 'refs/heads/main'
        env:
          REF: ${{ github.ref }}
        run: |
          echo "production deploys main only (got: $REF)"
          exit 1

      # Root files (package.json, the lockfile) come with cone-mode sparse
      # checkout; plus the email script and the posts it reads. Credentials are
      # not persisted.
      - name: Checkout (manifests, scripts and posts only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
            src/lib/content/posts

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # The server output keeps bare imports that wrangler bundles, so it needs
      # the locked packages; esbuild and workerd binaries arrive as optional
      # dependencies, so no install script is needed.
      - name: Install locked dependencies (no install scripts)
        run: npm ci --ignore-scripts

      - name: Download the build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: site-build

      - name: Deploy the editmamei-web Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SHA: ${{ github.sha }}
        run: |
          SHORT="${SHA:0:12}"
          npx wrangler deploy --tag "$SHORT" --message "main $SHORT"

      # The route hands editmamei.com to the Worker. GitHub Pages answers with
      # `Via: 1.1 varnish` and no HSTS header; the Worker sends HSTS from
      # static/_headers. Fail the run if the live home page is missing or still
      # coming from Pages, so a deploy that didn't take is visible.
      - name: Check the live site is served by the Worker
        run: |
          for i in 1 2 3 4 5 6; do
            HEADERS=$(curl -s -o /dev/null -D - --max-time 15 https://editmamei.com/ | tr -d '\r')
            CODE=$(printf '%s\n' "$HEADERS" | awk 'NR == 1 { print $2 }')
            if [ "$CODE" = 200 ] && ! printf '%s\n' "$HEADERS" | grep -iq '^via: .*varnish' \
              && printf '%s\n' "$HEADERS" | grep -iq '^strict-transport-security:'; then
              echo "editmamei.com is served by the Worker"
              exit 0
            fi
            echo "not yet (attempt $i: $CODE), retrying in 10s..."; sleep 10
          done
          echo "::error::editmamei.com is not served by the Worker after deploy"
          exit 1

      # After the deploy and live check, so a failed email never blocks the
      # site, but a failure still shows as a failed step. Idempotent: posts
      # already mailed are skipped, so the daily rebuild is safe. This job only
      # runs on main (see the ref guard above).
      - name: Email new blog posts to the Editmamei updates list
        env:
          RESEND_BROADCAST_KEY: ${{ secrets.RESEND_BROADCAST_KEY }}
        run: node scripts/send-post-emails.mjs

  ping-indexnow:
    needs: deploy
    # The hourly rebuild would otherwise re-submit every URL to IndexNow 24 times a day.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Notify IndexNow (URL list derived from the live sitemap)
        run: |
          set -euo pipefail
          KEY="a4f8aefcc57e44b2992e9ff9694f520f"
          SITEMAP="https://editmamei.com/sitemap.xml"
          # Single source of truth: pull the just-deployed sitemap and extract its
          # <loc> URLs. A new indexable route is pinged automatically once it's in
          # the sitemap ROUTES array — no hand-maintained URL list here to drift.
          # Retry a few times in case the edge hasn't picked up the new version yet.
          URLS=""
          for i in 1 2 3 4 5; do
            URLS=$(curl -sf "$SITEMAP" | sed -n 's:.*<loc>\(.*\)</loc>.*:\1:p' || true)
            [ -n "$URLS" ] && break
            echo "sitemap not ready (attempt $i), retrying in 10s..."; sleep 10
          done
          if [ -z "$URLS" ]; then echo "Could not read sitemap URLs"; exit 1; fi
          PAYLOAD=$(printf '%s\n' "$URLS" | jq -R . | jq -s \
            --arg host "editmamei.com" --arg key "$KEY" \
            --arg keyLoc "https://editmamei.com/$KEY.txt" \
            '{host: $host, key: $key, keyLocation: $keyLoc, urlList: .}')
          echo "Submitting these URLs to IndexNow:"; printf '%s\n' "$URLS"
          curl -sf -o /dev/null -w "IndexNow status: %{http_code}\n" \
            -X POST "https://api.indexnow.org/IndexNow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$PAYLOAD"
