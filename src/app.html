<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#0d2818" />

		<link rel="canonical" href="https://editmamei.com/" />

		<link rel="icon" type="image/x-icon" href="/icons/favicon.ico" />
		<link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
		<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
		<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />

		<title>Editmamei — Unlock Photoshop with natural-language photo editing</title>
		<meta
			name="description"
			content="Unlock Photoshop with natural-language photo editing. AI orchestration, not generation. Your AI plans the edit; your own Photoshop does it. Pronounced like edamame."
		/>

		<meta
			property="og:title"
			content="Editmamei — Unlock Photoshop with natural-language photo editing"
		/>
		<meta
			property="og:description"
			content="AI orchestration, not generation. Your AI assistant plans the edit; your own Photoshop carries it out with its own real, non-generative tools. Pronounced like edamame."
		/>
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://editmamei.com/" />
		<meta property="og:site_name" content="Editmamei" />

		<meta name="twitter:card" content="summary_large_image" />
		<meta
			name="twitter:title"
			content="Editmamei — Unlock Photoshop with natural-language photo editing"
		/>
		<meta
			name="twitter:description"
			content="AI orchestration, not generation. Your AI plans the edit; your own Photoshop does it. Pronounced like edamame."
		/>

		<!--
			Structured data: tells engines "editmamei" is a real software product
			made by a real org, not a misspelling of edamame. Three @types:
			Organization (the brand), SoftwareApplication (the product), WebSite
			(the site itself). Each as a separate JSON-LD block so engines that
			parse only one type still get it.
		-->
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "Organization",
				"name": "Editmamei",
				"url": "https://editmamei.com/",
				"logo": "https://editmamei.com/icons/icon-512.png",
				"sameAs": ["https://github.com/editmamei", "https://www.instagram.com/editmamei/"]
			}
		</script>
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "SoftwareApplication",
				"name": "Editmamei",
				"description": "Unlock Photoshop with natural-language photo editing. AI orchestration, not generation: your AI assistant plans the edit and your own desktop Photoshop carries it out with its standard non-generative tools (adjustment layers, masks, selections, filters). Pronounced like edamame.",
				"url": "https://editmamei.com/",
				"image": "https://editmamei.com/icons/icon-512.png",
				"applicationCategory": "DesignApplication",
				"operatingSystem": "Windows 10/11, macOS 12+",
				"softwareRequirements": "Node.js 20+, Adobe Photoshop 2026 (v27.x; earlier versions unverified), MCP-compatible AI client",
				"offers": {
					"@type": "Offer",
					"price": "0",
					"priceCurrency": "USD"
				}
			}
		</script>
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "WebSite",
				"name": "Editmamei",
				"url": "https://editmamei.com/"
			}
		</script>

		<!--
			Microsoft Clarity — cookieless analytics. Heatmaps + session replay
			within a session, no persistent identifier. No consent banner needed
			while Clarity stays in cookieless mode. Drop-in marketing infrastructure
			per editmamei-web/CLAUDE.md "Marketing infrastructure" section; not
			reconciled into the product's privacy framing (Editmamei/docs/20260530-
			BRAND_VOICE_GUIDE.md §12 is about the npm package, not the website).
		-->
		<script type="text/javascript">
			(function (c, l, a, r, i, t, y) {
				c[a] =
					c[a] ||
					function () {
						(c[a].q = c[a].q || []).push(arguments);
					};
				t = l.createElement(r);
				t.async = 1;
				t.src = 'https://www.clarity.ms/tag/' + i;
				y = l.getElementsByTagName(r)[0];
				y.parentNode.insertBefore(t, y);
			})(window, document, 'clarity', 'script', 'wzto9hvwmu');
		</script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
